<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Saúde — Minhas avaliações</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="page">
    <div data-header="Início" data-mode="user"></div>
    <main class="wrap account">
      <aside class="card side">
        <img class="avatar" src="https://i.pravatar.cc/160?img=47" alt="Maria Silva">
        <b>Maria Silva</b>
        <nav class="side-nav">
          <a href="perfil.html">Editar perfil</a>
          <a href="favoritos.html">Meus favoritos</a>
          <a class="is-active" href="avaliacoes.html">Minhas avaliações</a>
          <a href="recuperar-senha.html">Alterar senha</a>
          <a class="btn-danger" href="index.html">Sair</a>
        </nav>
      </aside>
      <section>
        <h1 class="section-title">Minhas avaliações</h1>
        <div id="lista" class="list"></div>
      </section>
    </main>
    <div data-footer></div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    var minhas = WebSaude.unidades.slice(0, 6).map(function (u, i) {
      return { unidade: u.nome, id: u.id, nota: 5 - (i % 2), texto: "Atendimento atencioso e estrutura organizada.", data: (10 - i) + "/10/2023" };
    });
    WebSaude.ui.renderList({
      target: "#lista",
      items: minhas,
      perPage: 3,
      noun: "avaliações",
      render: function (a) {
        return '<article class="card info-card"><b>' + a.unidade + "</b><div>" + WebSaude.ui.stars(a.nota) + " · " + a.data + "</div><p>" + a.texto + '</p><a href="detalhes.html?id=' + a.id + '">Ver unidade</a></article>';
      }
    });
  </script>
</body>
</html>
