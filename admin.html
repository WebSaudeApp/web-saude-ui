<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Saúde — Painel admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="page">
    <div data-header="Início" data-mode="admin"></div>
    <main class="wrap admin">
      <aside class="card side-nav" style="padding:16px;align-content:start">
        <a class="is-active" href="#dash">Dashboard</a>
        <a href="#pendentes">Aprovar unidades</a>
        <a href="#usuarios">Gerenciar usuários</a>
      </aside>
      <div>
        <div class="kpis">
          <article class="card kpi"><span>Total de unidades</span><b>248</b></article>
          <article class="card kpi"><span>Total de usuários</span><b>1.842</b></article>
          <article class="card kpi"><span>Unidades pendentes</span><b>7</b></article>
          <article class="card kpi"><span>Avaliações recentes</span><b>36</b></article>
        </div>
        <section id="pendentes" style="margin-top:22px">
          <h2 class="section-title">Pendentes de aprovação</h2>
          <div class="card" id="lista-pendentes"></div>
        </section>
        <section id="usuarios" style="margin-top:22px">
          <div class="toolbar">
            <h2 class="section-title" style="margin:0">Usuários</h2>
            <input class="input" id="buscaUser" placeholder="Buscar usuários..." style="max-width:260px">
          </div>
          <div class="card" id="lista-users"></div>
        </section>
      </div>
    </main>
    <div data-footer></div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    var pendentes = WebSaude.unidades.filter(function (u) { return u.aprovacao === "Pendente"; });
    if (pendentes.length < 3) pendentes = WebSaude.unidades.slice(0, 7).map(function (u, i) {
      return Object.assign({}, u, { aprovacao: "Pendente", gestor: ["Dr. Roberto", "Ana Lima", "Carlos Gomes"][i % 3], data: (10 + i) + "/10/2023" });
    });
    WebSaude.ui.renderList({
      target: "#lista-pendentes",
      items: pendentes,
      perPage: 3,
      noun: "pendentes",
      render: function (u) {
        return '<div style="display:grid;grid-template-columns:2fr 1fr 1fr 1.6fr;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line);align-items:center">' +
          "<div><b>" + u.nome + "</b></div><div>" + (u.gestor || "Gestor") + "</div><div>" + (u.data || "10/10/2023") + "</div>" +
          '<div class="row-actions"><button type="button" data-ok>Aprovar</button><button class="danger" type="button">Rejeitar</button><a href="detalhes.html?id=' + u.id + '">Ver detalhes</a></div></div>';
      }
    });
    function users() {
      var q = document.getElementById("buscaUser").value.toLowerCase();
      return WebSaude.usuarios.filter(function (u) { return (u.nome + u.email + u.tipo).toLowerCase().indexOf(q) >= 0; });
    }
    var userView = WebSaude.ui.renderList({
      target: "#lista-users",
      items: users,
      perPage: 3,
      noun: "usuários",
      render: function (u) {
        return '<div style="display:grid;grid-template-columns:1.3fr 1.5fr 1fr 1fr 1.2fr;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line);align-items:center">' +
          "<div><b>" + u.nome + "</b></div><div>" + u.email + '</div><div><span class="chip">' + u.tipo + "</span></div>" +
          '<div><span class="chip ' + (u.status === "Ativo" ? "chip-ok" : "chip-muted") + '">' + u.status + "</span></div>" +
          '<div class="row-actions"><button type="button">Ver</button><button type="button">Editar</button><button class="danger" type="button">Desativar</button></div></div>';
      }
    });
    document.getElementById("buscaUser").oninput = userView.refresh;
    document.getElementById("lista-pendentes").addEventListener("click", function (e) {
      if (e.target.hasAttribute("data-ok")) WebSaude.ui.toast("Unidade aprovada.");
      if (e.target.classList.contains("danger")) WebSaude.ui.toast("Unidade rejeitada.");
    });
  </script>
</body>
</html>
