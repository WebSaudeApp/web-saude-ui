<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Saúde — Meu perfil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="page">
    <div data-header="Início" data-mode="user"></div>
    <main class="wrap account">
      <aside class="card side">
        <img class="avatar" src="https://i.pravatar.cc/160?img=47" alt="Maria Silva">
        <b>Maria Silva</b>
        <div style="color:var(--muted);font-size:.9rem">maria@email.com</div>
        <span class="chip">Paciente</span>
        <nav class="side-nav">
          <a class="is-active" href="perfil.html">Editar perfil</a>
          <a href="favoritos.html">Meus favoritos</a>
          <a href="avaliacoes.html">Minhas avaliações</a>
          <a href="recuperar-senha.html">Alterar senha</a>
          <a class="btn-danger" href="index.html">Sair</a>
        </nav>
      </aside>
      <form class="card panel" id="form">
        <h1>Meus dados</h1>
        <label class="field"><span>Nome</span><input class="input" name="nome" value="Maria Silva"></label>
        <label class="field"><span>E-mail</span><input class="input" type="email" name="email" value="maria@email.com"></label>
        <label class="field"><span>Telefone</span><input class="input" name="telefone" value="(11) 98765-4321"></label>
        <label class="field"><span>Tipo de usuário</span><input class="input" value="Paciente" disabled></label>
        <div class="form-actions">
          <a class="btn btn-ghost" href="perfil.html">Cancelar</a>
          <button class="btn btn-primary" type="submit">Salvar alterações</button>
        </div>
      </form>
    </main>
    <div data-footer></div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("form").addEventListener("submit", function (e) {
      e.preventDefault();
      WebSaude.ui.toast("Perfil atualizado.");
    });
  </script>
</body>
</html>
