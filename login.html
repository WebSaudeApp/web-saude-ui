<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Saúde — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-page auth-fit">
    <div class="auth-split">
      <div class="auth-art">
        <h2>Cuidado mais perto de você</h2>
        <img class="auth-photo" src="assets/auth-ilustracao.webp" alt="" width="1438" height="1093">
      </div>
      <form class="card auth-card" id="form">
        <div data-brand></div>
        <h1>Entrar na sua conta</h1>
        <p class="sub">Acesse para favoritar e avaliar unidades</p>
        <label class="field"><span>E-mail</span><input class="input" type="email" name="email" placeholder="seu@email.com" required></label>
        <label class="field"><span>Senha</span><input class="input" type="password" name="senha" required></label>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <label class="check"><input type="checkbox" name="lembrar"> Lembrar-me</label>
          <a class="link" href="recuperar-senha.html">Esqueceu a senha?</a>
        </div>
        <button class="btn btn-primary btn-lg" type="submit">Entrar</button>
        <div class="auth-or"><span>ou</span></div>
        <button class="btn btn-google btn-lg" type="button" id="google">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.400 0 20.100 0 24s.9 7.6 2.600 10.800l7.900-6.100z"/><path fill="#34A853" d="M24 48c6.500 0 11.900-2.100 15.900-5.800l-7.500-5.800c-2.100 1.400-4.800 2.300-8.400 2.300-6.300 0-11.600-4.100-13.500-9.800l-7.900 6.100C6.500 42.600 14.600 48 24 48z"/></svg>
          Continuar com o Google
        </button>
        <p class="center-note">Não tem conta? <a href="registro.html">Criar conta</a></p>
      </form>
    </div>
  </div>
  <div class="toast"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.querySelectorAll("[data-brand]").forEach(function (el) { el.outerHTML = WebSaude.ui.brand("index.html", "teal"); });
    document.getElementById("google").addEventListener("click", function () {
      // Protótipo: simula o login com Google e segue para o perfil.
      location.href = "perfil.html";
    });
    document.getElementById("form").addEventListener("submit", function (e) {
      e.preventDefault();
      var email = this.email.value.toLowerCase();
      if (email.indexOf("admin") >= 0) location.href = "admin.html";
      else if (email.indexOf("gestor") >= 0) location.href = "minhas-unidades.html";
      else location.href = "perfil.html";
    });
  </script>
</body>
</html>
